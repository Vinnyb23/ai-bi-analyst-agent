name: CI

# Week 19 (Phase 4: MLOps & Deployment) of the AI/ML continuing-education
# program -- basic lint + test CI, added as practice on this repo before
# rolling the same pattern out to the Phase 1/2 repos and the Phase 4
# capstone.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned to match requirements.txt: numpy==2.5.2 only ships a
          # cp314 wheel as of this writing, so anything older fails install.
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Test (pytest)
        run: pytest tests/ -v
